# Copy to <project>/.github/workflows/unity-tests.yml. Runs the Unity tests on GitHub's machines
# instead of the laptop. Used when .agents/project.md has `test_location: ci` or `both`.
#
# Needs repo secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity .ulf license file
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
# GameCI's activation guide explains how to get the .ulf for a Personal license. Verify on first run.
name: Unity tests

on:
  push:
    branches: ['t[0-9]*-*']   # task branches from the workflow
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - uses: actions/cache@v6.1.0
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode          # editmode | playmode | all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity tests

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
